name: ShyCloud
options:
  bundleIdPrefix: com.ekremus
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: LQJCF4Z633
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  ShyCloudCore:
    path: Packages/ShyCloudCore
targets:
  ShyCloud:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Watchdog/com.ekremus.ShyCloud.Watchdog.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: ShyCloudCore
      - target: ShyCloudWatchdog
        embed: true
        copy:
          destination: executables
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: ShyCloud
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations: [en, tr]
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026 ekremus · GPL-3.0-or-later"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ekremus.ShyCloud
        PRODUCT_NAME: ShyCloud
  ShyCloudWatchdog:
    type: tool
    platform: macOS
    sources:
      - path: Watchdog/main.swift
    dependencies:
      - package: ShyCloudCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ekremus.ShyCloud.Watchdog
        PRODUCT_NAME: ShyCloudWatchdog
        SKIP_INSTALL: YES
schemes:
  ShyCloud:
    build:
      targets:
        ShyCloud: all
    run:
      config: Debug
    archive:
      config: Release
